name: 📚 Corregir o mejorar la wiki
description: Comunica información incorrecta, incompleta o poco clara de la documentación.
title: "[WIKI] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Utiliza este formulario únicamente para mejorar la documentación. Para un fallo de la impresora o del sistema, vuelve atrás y elige **Informar de un fallo**.

  - type: checkboxes
    id: requisitos
    attributes:
      label: Antes de continuar
      options:
        - label: He escrito el título y toda la incidencia en español.
          required: true
        - label: Esta incidencia trata sobre la documentación, no sobre un fallo de la impresora.
          required: true
        - label: He comprobado que no existe otro Issue abierto sobre lo mismo.
          required: true

  - type: input
    id: pagina
    attributes:
      label: Página de la wiki
      description: Indica el nombre de la página o pega su enlace.
      placeholder: 02 — Ajustes
    validations:
      required: true

  - type: input
    id: apartado
    attributes:
      label: Apartado concreto
      placeholder: Conexión WiFi
    validations:
      required: true

  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de problema
      options:
        - Información incorrecta
        - Información incompleta
        - Explicación poco clara
        - Enlace roto
        - Falta ortográfica o de formato
        - Otro problema de documentación
    validations:
      required: true

  - type: textarea
    id: problema
    attributes:
      label: ¿Qué debería revisarse?
      description: Explica de forma breve qué has encontrado.
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Corrección propuesta
      description: Si sabes cómo debería explicarse, puedes indicarlo aquí.

  - type: textarea
    id: observaciones
    attributes:
      label: Información adicional
      description: Añade una captura solo si ayuda y comprueba que no contiene datos privados.
